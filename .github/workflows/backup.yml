# Daily off-site copy of the account's data.
#
# Every byte this app stores lives on free tiers: Neon can suspend or reclaim an
# idle project, Render suspends a service that runs out of monthly instance
# hours, and until now the only way to get the data out was a human clicking
# Export in Settings. This is the same export, on a schedule, kept somewhere
# neither of those providers controls.
#
# Four things about it that are true and worth knowing before relying on it:
#
#  1. It needs the account password, because logging in is the only way to mint
#     a token -- there is no API key. That password is a repository secret, so
#     anyone who can write to this repo or read its secrets can reach the
#     account. Use a dedicated account, or accept that.
#  2. The artifact is a plaintext JSON dump of personal health data sitting in
#     GitHub for the retention window below. That is the trade being made: a
#     backup that is readable is a backup that works.
#  3. GitHub disables scheduled workflows in repositories with no activity for
#     60 days. A backup that silently stops is worse than none, so this also has
#     workflow_dispatch, and the run summary says when the last copy was taken.
#  4. The login endpoint is rate limited to 10/minute per IP. Fine for a daily
#     job; not fine if this is ever turned into a tight loop.
#
# Required repository secrets:
#   BACKUP_API_BASE   e.g. https://macros-calculator-api.onrender.com
#   BACKUP_EMAIL      the account to back up
#   BACKUP_PASSWORD   its password

name: Backup

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: GitHub queues scheduled jobs, and the
    # top of the hour is where every cron in the world piles up.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Only for the failure alert below, which opens (or comments on) an issue.
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Log in and export everything
        env:
          BACKUP_API_BASE: ${{ secrets.BACKUP_API_BASE }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_API_BASE:-}" ] || [ -z "${BACKUP_EMAIL:-}" ] || [ -z "${BACKUP_PASSWORD:-}" ]; then
            echo "::error::BACKUP_API_BASE, BACKUP_EMAIL and BACKUP_PASSWORD must all be set." >&2
            exit 1
          fi

          # Trim whitespace and wrapping quotes before using any of this.
          # GitHub's secret field stores exactly what was pasted, and a leading
          # space or a stray pair of quotes is invisible in a masked value --
          # the failure surfaces much later as `curl: (3) URL rejected`, four
          # retries deep, with the value starred out of the log. This is the
          # same treatment services/meal_ai.py gives its string settings, and
          # for the same reason.
          #
          # The password is deliberately NOT trimmed: a space is a legal
          # character in a password, and silently altering it would turn a
          # correct credential into a 401 nobody could explain.
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            v="${v%\"}"; v="${v#\"}"
            v="${v%\'}"; v="${v#\'}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }

          api="$(trim "$BACKUP_API_BASE")"
          api="${api%/}"
          BACKUP_EMAIL="$(trim "$BACKUP_EMAIL")"
          export BACKUP_EMAIL

          # Checked here rather than left to curl, which reports a malformed URL
          # as exit 3 after burning every retry -- and cannot say which of the
          # three secrets was wrong, because they are all masked by then.
          case "$api" in
            http://*|https://*) ;;
            *)
              echo "::error::BACKUP_API_BASE must start with https:// (its value is masked in this log; check the secret for a stray space, quote or missing scheme). Expected something like https://your-api.onrender.com" >&2
              exit 1
              ;;
          esac

          # Every file below either holds a credential or is derived from one.
          # A trap rather than `rm` after each step, because `set -e` means a
          # failed login exits before any cleanup line it has not reached yet --
          # which left the password sitting in login.json on exactly the runs
          # where something had already gone wrong.
          umask 077
          cleanup() {
            rm -f login.json token.json "${RUNNER_TEMP:-.}/curl.conf"
          }
          trap cleanup EXIT

          # The free instance sleeps after 15 minutes idle and takes up to a
          # minute to wake, so the first call has to be patient rather than
          # treated as an outage.
          echo "Waking $api …"
          curl -sS --fail --max-time 120 --retry 3 --retry-delay 15 \
            --retry-all-errors "$api/api/health" > /dev/null
          echo "awake"

          # Credentials via jq's env access and curl's stdin, never argv --
          # anything on a command line is visible to `ps` for the life of the
          # process, on a runner shared with whatever else this job installs.
          jq -n '{email: env.BACKUP_EMAIL, password: env.BACKUP_PASSWORD}' > login.json
          curl -sS --fail --max-time 60 \
            -H 'Content-Type: application/json' \
            --data @login.json \
            "$api/api/auth/login" > token.json

          token="$(jq -r '.access_token' token.json)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Login succeeded but returned no access token." >&2
            exit 1
          fi
          # Masked so a later `set -x` or an error dump cannot print it.
          echo "::add-mask::$token"

          # Same reasoning as above: the header goes in a config file rather
          # than on the command line.
          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$RUNNER_TEMP/curl.conf"

          curl -sS --fail --max-time 300 -K "$RUNNER_TEMP/curl.conf" \
            "$api/api/data/export/all" > backup.json

          # An export that is not valid JSON, or that carries no meals, is a
          # failure wearing a success's clothes -- an error page or an empty
          # account would otherwise be archived and reported as a good backup.
          jq -e 'type == "object" and has("exported_at") and has("meals")' backup.json > /dev/null

          meals=$(jq '.meals | length' backup.json)
          weights=$(jq '.weights | length' backup.json)
          analyses=$(jq '.ai_analyses | length' backup.json)
          bytes=$(wc -c < backup.json)

          if [ "$meals" -eq 0 ] && [ "$weights" -eq 0 ]; then
            echo "::error::Export contains no meals and no weigh-ins; refusing to call this a backup." >&2
            exit 1
          fi

          {
            echo "### Backup taken"
            echo ""
            echo "- When: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Meals: $meals"
            echo "- Weigh-ins: $weights"
            echo "- AI analyses: $analyses"
            echo "- Size: $bytes bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep it
        uses: actions/upload-artifact@v5
        with:
          name: macros-backup-${{ github.run_id }}
          path: backup.json
          # Deliberate, not the 90-day default. Long enough that a problem
          # noticed weeks late is still recoverable, short enough that health
          # data is not accumulating in GitHub indefinitely.
          retention-days: 30
          if-no-files-found: error

      # A backup nobody is watching is a backup nobody knows has stopped. Until
      # now a failed nightly run and a successful one looked identical unless
      # someone opened the Actions tab, which is precisely the habit a working
      # backup destroys.
      #
      # An issue rather than email: it needs no ESP account and no new secret --
      # both of which this project has already lost time to -- and it lands in
      # the same place the work is. GitHub notifies on issue activity, so the
      # email arrives anyway, by a route that cannot be rate limited or bounced.
      #
      # ⚠️ This catches a run that FAILED. It cannot catch a run that never
      # happened, which is the other way this stops: GitHub disables scheduled
      # workflows after 60 days of repository inactivity. Nothing inside a
      # workflow can report its own absence.
      - name: Say so if the backup failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          # Reuse an open report rather than filing a fresh one every night. A
          # backup that has been broken for a week is one problem, not seven,
          # and seven issues is how an alert trains you to ignore it.
          #
          # The type guard and the `|| true` are load-bearing. When this API
          # answers with an error *object* rather than an array, `.[0]` makes jq
          # exit 5, and under `set -o pipefail` that fails this step -- so the
          # one run that most needs to raise the alarm raises nothing at all.
          # Treating anything unreadable as "no existing issue" files a
          # duplicate at worst, which is strictly better than silence.
          existing="$(curl -sS "${auth[@]}" \
            "$api/issues?state=open&labels=backup-failure&per_page=1" \
            | jq -r 'if type == "array" then (.[0].number // empty) else empty end' \
            2>/dev/null || true)"

          if [ -n "$existing" ]; then
            jq -n --arg url "$RUN_URL" \
              '{body: ("Still failing: \($url)")}' > comment.json
            curl -sS --fail "${auth[@]}" -X POST --data @comment.json \
              "$api/issues/$existing/comments" > /dev/null
            echo "Commented on existing issue #$existing"
          else
            jq -n --arg url "$RUN_URL" '{
              title: "Backup failed",
              labels: ["backup-failure"],
              body: (
                "The nightly backup run failed, so there is no fresh copy of the account data.\n\n" +
                "Run: \($url)\n\n" +
                "Common causes, in the order they happen:\n" +
                "- A secret was re-pasted with a stray space or quote (BACKUP_API_BASE, BACKUP_EMAIL).\n" +
                "- The account password changed and BACKUP_PASSWORD was not updated.\n" +
                "- The API host moved, or the free instance would not wake.\n\n" +
                "The run log names which one. Close this issue once a run goes green."
              )}' > issue.json
            number="$(curl -sS --fail "${auth[@]}" -X POST --data @issue.json \
              "$api/issues" | jq -r '.number')"
            echo "Opened issue #$number"
          fi
