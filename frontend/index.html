<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- data-theme picks the colour theme (theme.css). Pinned to dark for now:
         today's screens hard-code dark colours, so they can't follow a light
         phone until the redesign rebuilds them. When they can, a small script
         here will resolve "follow the phone" before first paint. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Trackaholic: calorie and macro tracker with AI meal logging</title>
    <meta
      name="description"
      content="Log a meal from a photo, a voice note or a few words and get calorie and macro estimates. Track weight, water and supplements, with targets that adapt to you."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
